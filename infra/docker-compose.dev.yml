# Hot-reload overlay for Core / Agents / Collab (`tsx watch`).
# See docs/local-development.md — run website with `npm run dev` on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build firebase gcs core collab agents
#
# Polling helps WSL2/Docker Desktop file-watch misses.
services:
  core:
    volumes:
      - ../services/core/src:/app/src
    command: ["npm", "run", "dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"

  agents:
    volumes:
      - ../services/agents/src:/app/src
    command: ["npm", "run", "dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"

  collab:
    volumes:
      - ../services/collab/src:/app/src
    command: ["npm", "run", "dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
