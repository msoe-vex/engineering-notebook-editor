services:
  firebase:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - bash
      - -lc
      - |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jre-headless >/dev/null
        npm install -g firebase-tools@13.35.1
        firebase emulators:start --project demo-engineering-notebook --only auth,firestore
    ports:
      - "9099:9099"
      - "8081:8081"
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8081').then(()=>process.exit(0)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443"]
    ports:
      - "4443:4443"

  core:
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FIREBASE_PROJECT_ID: demo-engineering-notebook
      FIRESTORE_EMULATOR_HOST: firebase:8081
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      AUTH_FALLBACK: "true"
      GCS_BUCKET: engineering-notebook
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GCS_PUBLIC_BASE_URL: http://localhost:4443/storage/v1/b/engineering-notebook/o
      SERVICE_ADMIN_UID: service-admin
      INTERNAL_SERVICE_SECRET: local-dev-secret
      STORAGE_BACKEND: memory
    depends_on:
      firebase:
        condition: service_started
      gcs:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  collab:
    build:
      context: ..
      dockerfile: services/collab/Dockerfile
    ports:
      - "1234:1234"
    environment:
      PORT: "1234"
      COLLAB_AUTH_DISABLED: "true"
      CORE_API_URL: http://core:8080
      FIREBASE_PROJECT_ID: demo-engineering-notebook
      FIRESTORE_EMULATOR_HOST: firebase:8081
      AUTH_FALLBACK: "true"
      INTERNAL_SERVICE_SECRET: local-dev-secret
      SERVICE_ADMIN_UID: service-admin
    depends_on:
      core:
        condition: service_started

  agents:
    build:
      context: ..
      dockerfile: services/agents/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      FIREBASE_PROJECT_ID: demo-engineering-notebook
      FIRESTORE_EMULATOR_HOST: firebase:8081
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      AUTH_FALLBACK: "true"
      VERTEX_STUB: "true"
      SERVICE_ADMIN_UID: service-admin
    depends_on:
      core:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  website:
    build:
      context: ..
      dockerfile: website/Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: http://localhost:8080
        NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
        NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
        NEXT_PUBLIC_ASSETS_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-engineering-notebook.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-engineering-notebook
        NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8080
      NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
      NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
      NEXT_PUBLIC_ASSETS_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-engineering-notebook
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
    depends_on:
      core:
        condition: service_started
      collab:
        condition: service_started
      agents:
        condition: service_started
