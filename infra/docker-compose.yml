services:
  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  core:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  collab:
    build:
      context: ../services/collab
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - COLLAB_AUTH_DISABLED=true

  agents:
    build:
      context: ../services/agents
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
