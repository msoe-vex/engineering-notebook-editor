name: Build and Lint

on:
  pull_request:
    branches:
      - main

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shared
        working-directory: packages/shared
        run: npm install && npm run build

  website:
    runs-on: ubuntu-latest
    needs: shared
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build shared package
        working-directory: packages/shared
        run: npm install && npm run build
      - name: Link shared into website
        run: |
          mkdir -p node_modules/@engineering-notebook
          rm -rf node_modules/@engineering-notebook/shared
          cp -R ../packages/shared node_modules/@engineering-notebook/shared
      - name: Install dependencies
        run: npm ci
      - name: Re-link shared after npm ci
        run: |
          mkdir -p node_modules/@engineering-notebook
          rm -rf node_modules/@engineering-notebook/shared
          cp -R ../packages/shared node_modules/@engineering-notebook/shared
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      matrix:
        service: [core, collab, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shared
        working-directory: packages/shared
        run: npm install && npm run build
      - name: Install service
        working-directory: services/${{ matrix.service }}
        run: |
          npm install
          mkdir -p node_modules/@engineering-notebook
          rm -rf node_modules/@engineering-notebook/shared
          cp -R ../../packages/shared node_modules/@engineering-notebook/shared
      - name: Typecheck service
        working-directory: services/${{ matrix.service }}
        run: npx tsc -p tsconfig.json --noEmit
